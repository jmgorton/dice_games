<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Dice Games Settings</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link id="theme-stylesheet" rel="stylesheet" href="/shared/styles/settings-midnight.css" />
  </head>
  <body>
    <main class="settings-page">
      <header class="settings-header">
        <p class="eyebrow">Admin</p>
        <h1>Settings</h1>
        <p class="lead">Configuration scaffolding for app-level options.</p>
      </header>

      <section class="settings-card" aria-label="Theme settings">
        <div class="settings-card-head">
          <h2>Theme</h2>
          <span class="chip chip-draft">POC</span>
        </div>
        <p class="settings-description">
          Select a theme and return to Home to see it applied there after reload.
        </p>

        <label class="field-label" for="theme-picker">Theme preset</label>
        <select id="theme-picker" name="theme-picker">
          <option selected disabled>Loading themes...</option>
        </select>

        <p class="field-help">Selection is saved in localStorage for this browser.</p>
      </section>

      <footer class="settings-footer">
        <a class="back-link" href="/">Back to Home</a>
      </footer>
    </main>
    <script type="module" src="/settings/settings.js"></script>
  </body>
</html>
