map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Cache for auth validation responses
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=auth_cache:10m max_size=100m;

upstream serv {
    # server testa_app_1:3000;
    server main-app-1:3000;
}

upstream auth {
    # server testa_websock_1:6502;
    server main-auth-1:6502;
}

upstream play {
    # server: the names of the docker containers (`docker ps`) 
    server main-play-1:9090; 
}

upstream collab {
    server main-collab-1:8765;
}

upstream shared {
    server main-shared-1:7070;
}

server {
    listen 8080;

    # Serve custom error pages
    error_page 401 /401.html;
    error_page 403 /403.html;
    error_page 500 502 503 504 /50x.html;

    location = /error-pages.css {
        root /etc/nginx;
    }

    location = /401.html {
        root /etc/nginx;
        internal;
    }

    location = /403.html {
        root /etc/nginx;
        internal;
    }

    location = /50x.html {
        root /etc/nginx;
        internal;
    }

    # Internal auth validation subrequest location
    # Nginx calls this to validate tokens before proxying requests
    location = /_auth_validate {
        internal;
        proxy_pass http://auth/auth/validate;
        proxy_method POST;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "0";
        proxy_set_header Content-Type "application/json";
        # Pass the authToken cookie value as X-Auth-Token header
        proxy_set_header X-Auth-Token $cookie_authToken;
        # Cache auth responses: 200 (valid) for 5s, others for 1s
        proxy_cache auth_cache;
        proxy_cache_valid 200 5s;
        proxy_cache_valid 401 1s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }

    # Public auth endpoint - no auth required (must come before catch-all /)
    location ^~ /auth {
        proxy_pass http://auth;
    }

    # Public shared theme endpoints/assets (used by auth before login)
    location = /theme-manifest.json {
        proxy_pass http://shared;
    }

    location = /theme-config {
        proxy_pass http://shared;
    }

    location ^~ /shared/ {
        proxy_pass http://shared;
    }

    # Protected settings page served by shared service
    location ^~ /settings {
        auth_request /_auth_validate;
        proxy_pass http://shared;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    location / {
        auth_request /_auth_validate;
        proxy_pass http://serv;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    location /play {
        auth_request /_auth_validate;
        proxy_pass http://play;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    location /collab {
        auth_request /_auth_validate;
        # Route both HTTP and WebSocket requests to the same server
        proxy_pass http://collab;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}
