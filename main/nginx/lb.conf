map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream serv {
    # server testa_app_1:3000;
    server main-app-1:3000;
}

upstream auth {
    # server testa_websock_1:6502;
    server main-auth-1:6502;
}

upstream play {
    # server: the names of the docker containers (`docker ps`) 
    server main-play-1:9090; 
}

upstream collab {
    server main-collab-1:8765;
}

server {
    listen 8080;
    location / {
        proxy_pass http://serv;
    }

    location /auth {
        proxy_pass http://auth;
    }

    location /play {
        proxy_pass http://play;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    location /collab {
        proxy_pass http://collab;
        # adding nginx upgrade headers allow WebSocket handshake to be proxied through Nginx to the Python server 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        # proxy_read_timeout 86400;
    }
}
