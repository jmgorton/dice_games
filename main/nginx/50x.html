<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Service Unavailable</title>
    <link rel="stylesheet" href="/error-pages.css" />
  </head>
  <body>
    <div class="container">
      <div class="icon">🛠️</div>
      <h1>Service Issue</h1>
      <div class="status-code critical">5xx Server Error</div>
      <p>Something went wrong on our side. Please try again in a moment.</p>
      <div class="action">
        <a href="/">
          <span>Try Again</span>
          <span class="arrow">→</span>
        </a>
      </div>
      <footer>
        We’re working to restore service as quickly as possible.
      </footer>
    </div>
  </body>
</html>
