<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Authentication Required</title>
    <link rel="stylesheet" href="/error-pages.css" />
  </head>
  <body>
    <div class="container">
      <div class="icon">🔐</div>
      <h1>Access Denied</h1>
      <div class="status-code error">401 Unauthorized</div>
      <p>You need to be logged in to access this page. Please authenticate to continue.</p>
      <div class="action">
        <a href="/auth">
          <span>Go to Login</span>
          <span class="arrow">→</span>
        </a>
      </div>
      <footer>
        If you believe this is an error, please try logging in again or contact support.
      </footer>
    </div>
  </body>
</html>
