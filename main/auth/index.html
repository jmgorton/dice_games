<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Games - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
        }

        .auth-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 40px 20px;
            text-align: center;
        }

        .auth-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .auth-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #e0e0e0;
        }

        .tab-button {
            flex: 1;
            padding: 16px;
            background: #f5f5f5;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s ease;
        }

        .tab-button:hover {
            background: #efefef;
        }

        .tab-button.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
            margin-bottom: -1px;
        }

        .tab-content {
            display: none;
            padding: 40px;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            background-color: #f9f9f9;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            display: none;
            font-size: 14px;
        }

        .message.error {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
            display: block;
        }

        .message.success {
            background-color: #efe;
            color: #3c3;
            border: 1px solid #cfc;
            display: block;
        }

        .message.loading {
            background-color: #eef;
            color: #33c;
            border: 1px solid #ccf;
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #33c;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .password-hint {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
        }

        .admin-hint {
            background: #f0f8ff;
            border-left: 3px solid #667eea;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>🎲 Dice Games</h1>
            <p>Family Game Collection</p>
        </div>

        <div class="tabs">
            <button class="tab-button active" data-tab="login">Login</button>
            <button class="tab-button" data-tab="register">Create Account</button>
        </div>

        <!-- Login Tab -->
        <div id="login" class="tab-content active">
            <div class="admin-hint">
                <strong>Demo Admin:</strong> username: <code>admin</code>, password: <code>family-password</code>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input 
                        type="text" 
                        id="login-username" 
                        name="username" 
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input 
                        type="password" 
                        id="login-password" 
                        name="password" 
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>
                <button type="submit" id="loginSubmitBtn">Login</button>
            </form>
            <div id="loginMessage" class="message"></div>
        </div>

        <!-- Register Tab -->
        <div id="register" class="tab-content">
            <form id="registerForm">
                <div class="form-group">
                    <label for="register-username">Username</label>
                    <input 
                        type="text" 
                        id="register-username" 
                        name="username" 
                        placeholder="Choose a username"
                        autocomplete="username"
                        required
                    >
                    <div class="password-hint">3-20 characters, letters/numbers/underscore/hyphen only</div>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input 
                        type="password" 
                        id="register-password" 
                        name="password" 
                        placeholder="Choose a password"
                        autocomplete="new-password"
                        required
                    >
                    <div class="password-hint">At least 6 characters</div>
                </div>
                <div class="form-group">
                    <label for="register-password-confirm">Confirm Password</label>
                    <input 
                        type="password" 
                        id="register-password-confirm" 
                        name="passwordConfirm" 
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >
                </div>
                <button type="submit" id="registerSubmitBtn">Create Account</button>
            </form>
            <div id="registerMessage" class="message"></div>
        </div>
    </div>

    <script>
        class DiceGamesAuth {
            constructor(authServerUrl = 'http://localhost:1313') {
                this.authServerUrl = authServerUrl;
                this.token = null;
            }

            async login(username, password) {
                const response = await fetch(`${this.authServerUrl}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Login failed');
                }

                const data = await response.json();
                this.token = data.token;
                localStorage.setItem('diceGamesAuthToken', this.token);
                localStorage.setItem('diceGamesUsername', data.username);
                console.log('Login successful');
                return data;
            }

            async register(username, password, passwordConfirm) {
                const response = await fetch(`${this.authServerUrl}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, passwordConfirm })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Registration failed');
                }

                const data = await response.json();
                console.log('Registration successful');
                return data;
            }

            getToken() {
                return this.token || localStorage.getItem('diceGamesAuthToken');
            }

            isAuthenticated() {
                return !!this.getToken();
            }
        }

        const auth = new DiceGamesAuth();

        // Tab switching
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', () => {
                const tabName = button.dataset.tab;
                
                // Hide all tabs
                document.querySelectorAll('.tab-content').forEach(tab => {
                    tab.classList.remove('active');
                });

                // Remove active class from all buttons
                document.querySelectorAll('.tab-button').forEach(btn => {
                    btn.classList.remove('active');
                });

                // Show selected tab
                document.getElementById(tabName).classList.add('active');
                button.classList.add('active');
            });
        });

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const messageEl = document.getElementById('loginMessage');
            const submitBtn = document.getElementById('loginSubmitBtn');

            if (!username || !password) {
                showMessage(messageEl, 'Please enter username and password', 'error');
                return;
            }

            submitBtn.disabled = true;
            showMessage(messageEl, 'Logging in...', 'loading');

            try {
                await auth.login(username, password);
                showMessage(messageEl, 'Login successful! Redirecting...', 'success');
                setTimeout(() => redirectToApp(), 1000);
            } catch (err) {
                submitBtn.disabled = false;
                showMessage(messageEl, err.message || 'Login failed', 'error');
                document.getElementById('login-password').value = '';
            }
        });

        // Register form handler
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('register-username').value.trim();
            const password = document.getElementById('register-password').value;
            const passwordConfirm = document.getElementById('register-password-confirm').value;
            const messageEl = document.getElementById('registerMessage');
            const submitBtn = document.getElementById('registerSubmitBtn');

            if (!username || !password || !passwordConfirm) {
                showMessage(messageEl, 'Please fill in all fields', 'error');
                return;
            }

            submitBtn.disabled = true;
            showMessage(messageEl, 'Creating account...', 'loading');

            try {
                await auth.register(username, password, passwordConfirm);
                showMessage(messageEl, 'Account created! Switching to login...', 'success');
                
                // Switch to login tab and prefill username
                setTimeout(() => {
                    document.querySelector('[data-tab="login"]').click();
                    document.getElementById('login-username').value = username;
                    document.getElementById('login-password').focus();
                }, 800);
            } catch (err) {
                submitBtn.disabled = false;
                showMessage(messageEl, err.message || 'Registration failed', 'error');
                document.getElementById('register-password').value = '';
                document.getElementById('register-password-confirm').value = '';
            }
        });

        function showMessage(messageEl, text, type) {
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            
            if (type === 'loading') {
                messageEl.innerHTML = `<span class="loading-spinner"></span>${text}`;
            }
        }

        function redirectToApp() {
            window.location.href = `${window.location.origin}`;
        }

        // // If already authenticated, redirect
        // if (auth.isAuthenticated()) {
        //     redirectToApp();
        // }
    </script>
</body>
</html>
