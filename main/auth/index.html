<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Games - Login</title>
    <link id="theme-stylesheet" rel="stylesheet" href="/shared/styles/auth-midnight.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>🎲 Dice Games</h1>
            <p>Family Game Collection</p>
        </div>

        <div class="tabs">
            <button class="tab-button active" data-tab="login">Login</button>
            <button class="tab-button" data-tab="register">Create Account</button>
        </div>

        <!-- Login Tab -->
        <div id="login" class="tab-content active">
            <div class="admin-hint" hidden>
                <strong>Demo Admin:</strong> username: <code>admin</code>, password: <code>family-password</code>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input 
                        type="text" 
                        id="login-username" 
                        name="username" 
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input 
                        type="password" 
                        id="login-password" 
                        name="password" 
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>
                <button type="submit" id="loginSubmitBtn">Login</button>
            </form>
            <div id="loginMessage" class="message"></div>
        </div>

        <!-- Register Tab -->
        <div id="register" class="tab-content">
            <form id="registerForm">
                <div class="form-group">
                    <label for="register-username">Username</label>
                    <input 
                        type="text" 
                        id="register-username" 
                        name="username" 
                        placeholder="Choose a username"
                        autocomplete="username"
                        required
                    >
                    <div class="password-hint">3-20 characters, letters/numbers/underscore/hyphen only</div>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input 
                        type="password" 
                        id="register-password" 
                        name="password" 
                        placeholder="Choose a password"
                        autocomplete="new-password"
                        required
                    >
                    <div class="password-hint">At least 6 characters</div>
                </div>
                <div class="form-group">
                    <label for="register-password-confirm">Confirm Password</label>
                    <input 
                        type="password" 
                        id="register-password-confirm" 
                        name="passwordConfirm" 
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >
                </div>
                <button type="submit" id="registerSubmitBtn">Create Account</button>
            </form>
            <div id="registerMessage" class="message"></div>
        </div>
    </div>

    <script>
        const THEME_KEY = 'diceGamesThemeId';
        const MANIFEST_PATH = '/theme-manifest.json';

        async function fetchThemeManifest() {
            const response = await fetch(MANIFEST_PATH, { cache: 'no-store' });
            if (!response.ok) throw new Error(`Failed to load theme manifest: ${response.status}`);
            const manifest = await response.json();
            if (!Array.isArray(manifest)) throw new Error('Theme manifest must be an array');
            return manifest;
        }

        async function fetchValidatedThemeCssPath(themeId, page) {
            const response = await fetch(`/theme-config?themeId=${encodeURIComponent(themeId)}&page=${encodeURIComponent(page)}`, { cache: 'no-store' });
            if (!response.ok) throw new Error(`Failed to resolve theme path: ${response.status}`);
            const payload = await response.json();
            if (!payload?.cssPath || typeof payload.cssPath !== 'string') {
                throw new Error('Invalid theme config response');
            }
            return payload.cssPath;
        }

        async function initializeAuthTheme() {
            const stylesheetEl = document.getElementById('theme-stylesheet');
            if (!stylesheetEl) return;
            try {
                const themes = await fetchThemeManifest();
                if (!themes.length) return;
                const storedThemeId = localStorage.getItem(THEME_KEY);
                const activeTheme = themes.find(theme => theme.id === storedThemeId) ?? themes[0];
                if (!activeTheme?.id) return;
                const cssPath = await fetchValidatedThemeCssPath(activeTheme.id, 'auth');
                stylesheetEl.setAttribute('href', cssPath);
            } catch (error) {
                console.error(error);
            }
        }

        initializeAuthTheme();

        class DiceGamesAuth {
            constructor(authServerUrl = 'http://localhost:1313') {
                this.authServerUrl = authServerUrl;
                this.token = null;
            }

            async login(username, password) {
                const response = await fetch(`${this.authServerUrl}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Login failed');
                }

                const data = await response.json();
                this.token = data.token;
                localStorage.setItem('diceGamesAuthToken', this.token);
                localStorage.setItem('diceGamesUsername', data.username);
                console.log('Login successful');
                return data;
            }

            async register(username, password, passwordConfirm) {
                const response = await fetch(`${this.authServerUrl}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, passwordConfirm })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Registration failed');
                }

                const data = await response.json();
                console.log('Registration successful');
                return data;
            }

            getToken() {
                return this.token || localStorage.getItem('diceGamesAuthToken');
            }

            isAuthenticated() {
                return !!this.getToken();
            }
        }

        const auth = new DiceGamesAuth();

        // Tab switching
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', () => {
                const tabName = button.dataset.tab;
                
                // Hide all tabs
                document.querySelectorAll('.tab-content').forEach(tab => {
                    tab.classList.remove('active');
                });

                // Remove active class from all buttons
                document.querySelectorAll('.tab-button').forEach(btn => {
                    btn.classList.remove('active');
                });

                // Show selected tab
                document.getElementById(tabName).classList.add('active');
                button.classList.add('active');
            });
        });

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const messageEl = document.getElementById('loginMessage');
            const submitBtn = document.getElementById('loginSubmitBtn');

            if (!username || !password) {
                showMessage(messageEl, 'Please enter username and password', 'error');
                return;
            }

            submitBtn.disabled = true;
            showMessage(messageEl, 'Logging in...', 'loading');

            try {
                await auth.login(username, password);
                showMessage(messageEl, 'Login successful! Redirecting...', 'success');
                setTimeout(() => redirectToApp(), 1000);
            } catch (err) {
                submitBtn.disabled = false;
                showMessage(messageEl, err.message || 'Login failed', 'error');
                document.getElementById('login-password').value = '';
            }
        });

        // Register form handler
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('register-username').value.trim();
            const password = document.getElementById('register-password').value;
            const passwordConfirm = document.getElementById('register-password-confirm').value;
            const messageEl = document.getElementById('registerMessage');
            const submitBtn = document.getElementById('registerSubmitBtn');

            if (!username || !password || !passwordConfirm) {
                showMessage(messageEl, 'Please fill in all fields', 'error');
                return;
            }

            submitBtn.disabled = true;
            showMessage(messageEl, 'Creating account...', 'loading');

            try {
                await auth.register(username, password, passwordConfirm);
                showMessage(messageEl, 'Account created! Switching to login...', 'success');
                
                // Switch to login tab and prefill username
                setTimeout(() => {
                    document.querySelector('[data-tab="login"]').click();
                    document.getElementById('login-username').value = username;
                    document.getElementById('login-password').focus();
                }, 800);
            } catch (err) {
                submitBtn.disabled = false;
                showMessage(messageEl, err.message || 'Registration failed', 'error');
                document.getElementById('register-password').value = '';
                document.getElementById('register-password-confirm').value = '';
            }
        });

        function showMessage(messageEl, text, type) {
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            
            if (type === 'loading') {
                messageEl.innerHTML = `<span class="loading-spinner"></span>${text}`;
            }
        }

        function redirectToApp() {
            window.location.href = `${window.location.origin}`;
        }

        // // If already authenticated, redirect
        // if (auth.isAuthenticated()) {
        //     redirectToApp();
        // }
    </script>
</body>
</html>
