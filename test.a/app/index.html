<!DOCTYPE html>

<html>
  <head>
    <title>Dice Games</title>
    <meta charset="utf-8" />
    <!-- moving from CommonJS to ES modules -->
    <!-- type="text/javascript" for CommonJS, type="module" for ES modules -->
     <script type="module" src="utils.js"></script>
  </head>
  <body>
    <!-- iframe: margin: 0; padding: 0; -->
    <!-- <h1>hi from <a id="hostname"><iframe id="testFrame" src="/hostname" style="border: none; display: block;"></iframe></a></h1> -->
    <h1 style="text-align: center;">hi from <span id="hostname">unknown host</span></h1>
    <!-- wrapper: justify-content: flex-start; flex-direction: row;  -->
    <div id="wrapper" style="display: flex; width: 100%; gap: 5px; height: 60vh;">
      <!-- nav:  align-items: start; justify-content: start; -->
      <div id="nav" style="width: 20%;">
        <div id="nav-buttons" ></div>
        <div id="login-inputs" ></div>
      </div>
  
      <div id="chat" style="display: flex; width: 50%; flex-direction: column; border: 1px solid black;">
        <div id="chatbox"></div>
        <!-- chatInput: flex-direction: row; justify-content: space-evenly;  -->
        <div id="chatInput" style="display: flex; margin-top: auto;">
          <input id="text" style="flex-grow: 1;" />
          <input id="send" style="max-width: fit-content;" />
        </div>
      </div>
      <div id="userlistbox" style="border: 1px solid black; width: 20%; height: 100%;"></div>
    </div>
  </body>
</html>
