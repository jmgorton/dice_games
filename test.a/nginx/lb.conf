map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream serv {
    # server testa_app_1:3000;
    server testa-app-1:3000;
}

upstream websock {
    # server testa_websock_1:6502;
    server testa-websock-1:6502;
}

upstream test {
    # server: the names of the docker containers (`docker ps`) 
    server testa-test-1:9090; 
}

upstream pywss {
    server testa-pywss-1:8765;
}

server {
    listen 8080;
    location / {
        proxy_pass http://serv;
    }

    location /chat {
        proxy_pass http://websock;
    }

    location /test {
        proxy_pass http://test;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    location /pywss {
        proxy_pass http://pywss;
        # adding nginx upgrade headers allow WebSocket handshake to be proxied through Nginx to the Python server 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        # proxy_read_timeout 86400;
    }
}
